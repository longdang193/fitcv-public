# @architecture
# owner: cv_system
# features:
#   - cv_system
# stages:
#   - enrich
#   - ranking
#   - cv_analysis
# capabilities:
#   - cv_system.analysis-evidence-selection
# role: config
# canonical: true

# Pipeline behaviour — limits, model names, batch sizes, rate limits.
# Consumed by: enrich.py, embeddings.py, vector_search.py, ai_score.py.
# Override any value in .env.yaml; pipeline.yaml defaults apply otherwise.

# ── AI model compatibility fallbacks ───────────────────────────────────────────
# Canonical active owner for stage model selection is control-plane model routing:
#   control_plane.model_routing.parts.<stage>.model
# These remain fallback defaults for compatibility paths only.
gemini_model: gemini-2.5-flash
embedding_model: text-embedding-005

# ── Enrichment (Task 4) ────────────────────────────────────────────────────────
enrichment_version: v1
enrichment_sleep_secs: 0.0             # default: no enforced delay between enrichment calls
enrichment_batch_size: 10              # default enrichment batch size
enrichment_concurrency: 8              # default enrichment parallel workers

# ── Embeddings (Task 6) ────────────────────────────────────────────────────────
embedding_batch_size: 100

# ── Semantic retrieval (Task 8) ────────────────────────────────────────────────
pipeline:
  vector_search_top_n: 50              # canonical shortlist top-N for vector search
  ai_score_top_n: 50                   # canonical ranking top-N for AI scoring
  final_top_n: 15                      # canonical final ranked list size
  evidence_top_k: 5                    # canonical cv_analysis evidence bundle size

run_lifecycle:
  max_runtime_minutes: 240             # admin control-plane timeout guard for unfinished runs

outbox_replay_health:
  min_replay_success_ratio: 0.95       # default alert threshold for outbox replay health checks

vector_top_n: 50                       # top-N returned by VECTOR_SEARCH
vector_max_candidate_skills: 15        # max skills included in candidate query text
retrieval_strategy: job_summary_v1     # stored in vector_shortlist.retrieval_strategy

# ── AI reranking (Task 9) ──────────────────────────────────────────────────────
rerank_top_n: 50                       # max shortlisted jobs sent to AI reranking
rerank_sleep_secs: 0.0                 # default: no enforced delay between ranking calls

stage_runtime:
  enrich:
    sleep_secs: 0.0
    batch_size: 10
    concurrency: 8
  ranking:
    sleep_secs: 0.0
    concurrency: 4
  cv_analysis:
    concurrency: 4
  cv_generation:
    concurrency: 4

synonym_management:
  apply_to_run_enabled: true
  promote_global_enabled: true
  triage_recommendation_reuse_enabled: true
  auto_apply_recommendation_enabled: true
  auto_promote_global_enabled: true

reuse:
  enrich:
    enabled: true
  ranking:
    enabled: true
  cv_analysis:
    enabled: true
  cv_generation:
    enabled: true
  synonym_triage:
    enabled: true
