# @architecture
# owner: cv_system
# features:
#   - cv_system
# stages:
#   - enrich
#   - ranking
#   - cv_analysis
# capabilities:
#   - cv_system.analysis-evidence-selection
# role: config
# canonical: true

# Pipeline behaviour — limits, model names, batch sizes, rate limits.
# Consumed by: enrich.py, embeddings.py, vector_search.py, ai_score.py.
# Override any value in .env.yaml; pipeline.yaml defaults apply otherwise.

# ── AI models ──────────────────────────────────────────────────────────────────
gemini_model: gemini-2.5-flash         # used by enrich.py and ai_score.py
embedding_model: text-embedding-005    # used by embeddings.py

# ── Enrichment (Task 4) ────────────────────────────────────────────────────────
enrichment_version: v1
enrichment_sleep_secs: 1.0             # sleep between Gemini calls (free-tier: 1 req/s)

# ── Embeddings (Task 6) ────────────────────────────────────────────────────────
embedding_batch_size: 100

# ── Semantic retrieval (Task 8) ────────────────────────────────────────────────
pipeline:
  vector_search_top_n: 50              # canonical shortlist top-N for vector search
  ai_score_top_n: 50                   # canonical ranking top-N for AI scoring
  final_top_n: 10                      # canonical final ranked list size
  evidence_top_k: 5                    # canonical cv_analysis evidence bundle size

run_lifecycle:
  max_runtime_minutes: 240             # admin control-plane timeout guard for unfinished runs

vector_top_n: 50                       # top-N returned by VECTOR_SEARCH
vector_max_candidate_skills: 15        # max skills included in candidate query text
retrieval_strategy: job_summary_v1     # stored in vector_shortlist.retrieval_strategy

# ── AI reranking (Task 9) ──────────────────────────────────────────────────────
rerank_top_n: 50                       # max shortlisted jobs sent to AI reranking
rerank_sleep_secs: 0.5                 # sleep between Vertex AI scoring calls
