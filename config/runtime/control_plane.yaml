# @architecture
# owner: operator_control_plane
# features:
#   - none
# stages:
#   - none
# capabilities:
#   - operator-control-plane-phase-2-portability
# role: config
# canonical: true

control_plane:
  data_backend:
    type: sqlite
    bigquery:
      project: fitcv-491123
      dataset: fitcv
    sqlite:
      path: data/fitcv_cp.sqlite3

  providers:
    openai_compatible:
      base_url: http://host.docker.internal:20128/v1
      wire_api: chat_completions
      timeout_seconds: 60
    openai:
      base_url: https://api.openai.com/v1
      wire_api: chat_completions

  model_routing:
    parts:
      enrich_extraction:
        provider: openai_compatible
        model: cx/gpt-5.2
      ranking_ai_score:
        provider: openai_compatible
        model: cx/gpt-5.2
      cv_generation_structured_write:
        provider: openai_compatible
        model: cx/gpt-5.2
    task_overrides: {}

  observability:
    emit_model_routing_diagnostics: true
    emit_backend_capability_diagnostics: true
    otel_export_enabled: true

  feature_flags:
    sqlite_mode_enabled: true

  fitcv_cp:
    retry:
      enabled: false
      max_attempts: 1
      backoff_seconds: [1, 2, 4, 8]
      lease_seconds: 900
      reconciler_interval_seconds: 0
      error_details_max_chars: 2048
