# ── Projects ──────────────────────────────────────────────────────────────────
projects:
  - id: "proj_1"
    name: "FitCV — AI-Powered CV Generation Pipeline"
    url: "https://github.com/nguyenvana/fitcv"
    duration: "2024-01 — present"
    skills: ["Python", "BigQuery", "Vertex AI", "Gemini", "dbt", "Docker", "Terraform", "GitHub Actions"]
    tech_stack:
      - "Backend: Python, FastAPI, RQ (Redis Queue)"
      - "AI: Vertex AI Gemini 2.5 Flash"
      - "Data: BigQuery, dbt, Great Expectations"
      - "Infrastructure: GCP, Terraform, Docker"
      - "CI/CD: GitHub Actions"
    business_value: >
      End-to-end AI pipeline that ingests job postings, matches against candidate profiles
      using BigQuery ML embeddings, and generates tailored CVs via Gemini. Reduced manual
      CV tailoring time from 2 hours to under 5 minutes per application.
    highlights:
      - "Ingested 5,000+ LinkedIn job postings via scraper pipeline"
      - "Achieved 89% relevance score on candidate–job matching via embedding similarity"
      - "Serving 20+ candidates in production"

  - id: "proj_2"
    name: "Real-Time Fraud Detection on AWS"
    url: "https://github.com/nguyenvana/fraud-detection"
    duration: "2023-03 — 2023-08"
    skills: ["Python", "AWS Kinesis", "BigQuery ML", "Kafka", "SQL"]
    tech_stack:
      - "Stream Processing: AWS Kinesis, Kafka"
      - "ML: BigQuery ML (Random Forest), Python scikit-learn"
      - "Storage: AWS Redshift, S3"
      - "Orchestration: Apache Airflow"
    business_value: >
      Real-time fraud detection system processing 10,000 transactions/minute with
      sub-100ms latency, detecting fraud with 94% precision and reducing false positives
      by 30% compared to the previous rule-based system.
    highlights:
      - "Trained and deployed BQML random forest model with 94% precision, 91% recall"
      - "Integrated with existing Kafka consumer pipeline with zero downtime"

  - id: "proj_3"
    name: "Open-Source dbt Package for Marketing Attribution"
    url: "https://github.com/nguyenvana/dbt-marketing-attribution"
    duration: "2022-06 — 2022-10"
    skills: ["dbt", "SQL", "Python", "Docker", "Bash"]
    tech_stack:
      - "dbt Core / dbt Cloud"
      - "Python (pytest, setuptools)"
      - "Docker"
      - "GitHub Actions (CI)"
    business_value: >
      Reusable dbt package enabling data teams to implement multi-touch marketing
      attribution (first-touch, last-touch, linear) without reinventing the wheel.
      150+ GitHub stars, used by 12 companies.
    highlights:
      - "150+ GitHub stars, 12 production adopters"
      - "100% test coverage with dbt-expectations and pytest"

