feature_id: bounded_parallel_enrichment
name: Bounded Parallel Enrichment
status: active
type: add
summary: Enrichment runs in bounded parallel batches with admin-controlled concurrency settings.
invariants: []
domains:
  - api_optimization
  - pipeline
depends_on:
  - pipeline_performance
capabilities:
  - capability_id: bounded_parallel_enrichment.enrichment-batch-size-setting
    statement: enrichment_batch_size setting
    state: active
  - capability_id: bounded_parallel_enrichment.enrichment-concurrency-setting
    statement: enrichment_concurrency setting
    state: active
  - capability_id: bounded_parallel_enrichment.pre-enrichment-global-filters-run-first
    statement: Pre-enrichment global filters run first
    state: active
  - capability_id: bounded_parallel_enrichment.conservative-defaults-batch-size-10-concurrency-1
    statement: Conservative defaults (batch_size=10, concurrency=1)
    state: active
  - capability_id: bounded_parallel_enrichment.deterministic-output-order
    statement: Deterministic output order
    state: active
  - capability_id: bounded_parallel_enrichment.per-job-failure-isolation
    statement: Per-job failure isolation
    state: active
stage_participation:
  - stage_id: enrich
    role: primary
    capability_ids:
      - bounded_parallel_enrichment.conservative-defaults-batch-size-10-concurrency-1
      - bounded_parallel_enrichment.deterministic-output-order
      - bounded_parallel_enrichment.enrichment-batch-size-setting
      - bounded_parallel_enrichment.enrichment-concurrency-setting
      - bounded_parallel_enrichment.per-job-failure-isolation
      - bounded_parallel_enrichment.pre-enrichment-global-filters-run-first
