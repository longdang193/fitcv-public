feature_id: pipeline_performance
name: Pipeline Performance
status: active
type: modify
summary: Reduced API costs by filtering jobs before enrichment, using reliable structured output parsing, centralizing enrich prompt management, reusing unchanged enrich results via fingerprints, reusing unchanged shortlist embeddings via a structured signature plus embedding contract, extending bounded semantic lift to the most important `cv_analysis` fit channels, short-circuiting reranker `skip` jobs before expensive `cv_analysis` work, and trimming dead-weight operator-facing payloads, especially by tightening the `results.json` ledger boundary and row-scaled timeline noise.
invariants: []
domains:
  - api_optimization
  - pipeline
depends_on: []
capabilities:
  - capability_id: pipeline_performance.pre-enrichment-global-job-filters-applications-count-max-max-age-days
    statement: Pre-enrichment global job filters (applications_count_max, max_age_days)
    state: active
  - capability_id: pipeline_performance.explicit-rejection-reasons-in-rule-filter-results
    statement: Explicit rejection reasons in rule_filter_results
    state: active
  - capability_id: pipeline_performance.gemini-structured-output-with-response-schema-and-pydantic
    statement: Gemini structured output with response_schema and Pydantic
    state: active
  - capability_id: pipeline_performance.fallback-path-for-unparseable-responses
    statement: Fallback path for unparseable responses
    state: active
  - capability_id: pipeline_performance.enrich-extraction-prompt-text-now-comes-from-a-centralized-prompt-registry-with-config-selected-prompt-ids
    statement: Enrich extraction prompt text now comes from a centralized prompt registry with config-selected prompt IDs
    state: active
  - capability_id: pipeline_performance.enrich-stage-raw-plus-canonical-semantic-companions-for-repeated-downstream-fields
    statement: Enrich-stage raw-plus-canonical semantic companions for repeated downstream fields
    state: active
  - capability_id: pipeline_performance.canonical-skill-companion-lists-and-entity-payloads-for-required-preferred-skills
    statement: Canonical skill companion lists and entity payloads for required/preferred skills
    state: active
  - capability_id: pipeline_performance.enrich-stage-mapping-suggestion-capture-for-review-debug-surfaces
    statement: Enrich-stage mapping suggestion capture for review/debug surfaces
    state: active
  - capability_id: pipeline_performance.fingerprint-based-enrich-result-reuse-happens-before-llm-enrichment-using-normalized-raw-job-inputs
    statement: Fingerprint-based enrich-result reuse happens before LLM enrichment using normalized raw-job inputs
    state: active
  - capability_id: pipeline_performance.enrich-contract-fingerprinting-invalidates-reuse-automatically-when-prompt-model-schema-behavior-changes
    statement: Enrich-contract fingerprinting invalidates reuse automatically when prompt/model/schema behavior changes
    state: active
  - capability_id: pipeline_performance.shared-structured-jobs-reuse-lookup-avoids-redundant-enrich-calls-while-only-fresh-rows-are-upserted-back-into-the-shared-table
    statement: Shared `structured_jobs` reuse lookup avoids redundant enrich calls while only fresh rows are upserted back into the shared table
    state: active
  - capability_id: pipeline_performance.shortlist-now-builds-a-stable-structured-embedding-input-signature-before-generating-job-summary-vectors
    statement: Shortlist now builds a stable structured embedding-input signature before generating `job_summary` vectors
    state: active
  - capability_id: pipeline_performance.shortlist-reuses-the-latest-stored-embedding-row-for-a-job-url-only-when-both-the-structured-signature-and-embedding-contract-fingerprint-still-match
    statement: Shortlist reuses the latest stored embedding row for a `job_url` only when both the structured signature and embedding contract fingerprint still match
    state: active
  - capability_id: pipeline_performance.fresh-shortlist-embeddings-persist-signature-metadata-so-later-runs-can-skip-repeated-embedding-work-safely
    statement: Fresh shortlist embeddings persist signature metadata so later runs can skip repeated embedding work safely
    state: active
  - capability_id: pipeline_performance.operator-facing-enriched-job-exports-now-keep-canonical-semantic-fields-and-fingerprint-reuse-provenance-while-omitting-retired-raw-duplicate-classification-baggage
    statement: Operator-facing enriched-job exports now keep canonical semantic fields and fingerprint/reuse provenance while omitting retired raw duplicate classification baggage
    state: active
  - capability_id: pipeline_performance.large-runs-avoid-some-row-scaled-layer-4-event-noise-by-relying-more-on-aggregate-stage-summaries-plus-stage-owned-artifacts
    statement: Large runs avoid some row-scaled Layer 4 event noise by relying more on aggregate stage summaries plus stage-owned artifacts
    state: active
  - capability_id: pipeline_performance.results-json-now-keeps-only-compact-job-ledger-fields-instead-of-repeating-full-job-snapshots-heavy-score-explanation-internals-and-full-cv-bodies-already-represented-elsewhere
    statement: '`results.json` now keeps only compact job-ledger fields instead of repeating full job snapshots, heavy score-explanation internals, and full CV bodies already represented elsewhere'
    state: active
  - capability_id: pipeline_performance.cv-analysis-now-uses-bounded-semantic-lift-for-required-skill-and-role-channels-instead-of-reserving-semantic-work-only-for-domain-and-responsibility-alignment
    statement: '`cv_analysis` now uses bounded semantic lift for required-skill and role channels instead of reserving semantic work only for domain and responsibility alignment'
    state: active
  - capability_id: pipeline_performance.ranked-jobs-with-authoritative-reranker-fit-label-skip-now-stop-before-evidence-retrieval-gap-computation-and-semantic-alignment-inside-cv-analysis
    statement: Ranked jobs with authoritative reranker `fit_label = skip` now stop before evidence retrieval, gap computation, and semantic alignment inside `cv_analysis`
    state: active
