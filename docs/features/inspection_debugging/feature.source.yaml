feature_id: inspection_debugging
name: Inspection & Debugging
status: active
type: add
summary: Admins can see what the pipeline did for a run, including shared stage progress for both `Run All` and `Stage by Stage`, paused staged checkpoints, enrich reuse provenance, selectable rule-filter marks, shortlist retrieval and embedding-reuse diagnostics, richer shortlist candidate-query components, explicit shortlist candidate-query reuse provenance, ranking contribution visibility and calibration surfaces, late-stage reuse diagnostics for `ranking` and `cv_analysis`, slimmer job-ledger exports, compact per-job `results.json` rows, stage-local artifacts, compact severity-based run health with explicit `Pending` vs `N/A`, stage-gated export availability, a job-ledger `results.json` split from bundled stage diagnostics, outcome-first artifact samples, stable normalize timeline ownership, aggregate-first timeline summaries, explicit separation between reranker-blocked rows and true analyzed-and-skipped `cv_analysis` outcomes, truthful reranker-blocked propagation into compact `results.json` decision chains and `cv-debug` omission accounting, multi-channel evidence-selection provenance, lexical-vs-semantic alignment detail, inputs used, generated CVs, explicit decision detail, hybrid validation provenance from deterministic and soft-claim grounding checks, canonicalized settings-used exports, clearer `cv-debug` coverage accounting, and prompt-id-based provenance for both ranking and the active structured-only `cv_generation` path.
invariants: []
domains:
  - admin_ui
  - run_orchestration
depends_on:
  - admin_control_plane_core
capabilities:
  - capability_id: inspection_debugging.run-detail-inspection-tabs
    statement: Show the three-tab inspection surface and client-side tab switching for run detail.
    state: active
  - capability_id: inspection_debugging.run-progress-and-checkpoints
    statement: Show execution mode, reached stages, checkpoint state, and run-next-stage controls across run modes.
    state: active
  - capability_id: inspection_debugging.synonym-overlay-inspection
    statement: Surface active and default synonym-overlay state and snapshots during staged inspection flows.
    state: active
  - capability_id: inspection_debugging.run-owned-artifact-exports
    statement: Provide run-scoped downloads such as CVs, artifact bundles, and CV debug exports when owned outputs exist.
    state: active
  - capability_id: inspection_debugging.stage-artifact-downloads
    statement: Expose stage-owned downloads only after the owning stage has been reached and the artifact exists.
    state: active
  - capability_id: inspection_debugging.settings-used-export
    statement: Show canonical operator-facing settings-used exports and compatibility projections when needed.
    state: active
  - capability_id: inspection_debugging.results-ledger-inspection
    statement: Keep `results.json` job-centric while exposing compact decision chains, skip states, and export-ready outcomes.
    state: active
  - capability_id: inspection_debugging.stage-transition-diagnostics
    statement: Provide aggregate timeline rows and bounded per-stage transition artifacts for major stage handoffs.
    state: active
  - capability_id: inspection_debugging.prompt-provenance-diagnostics
    statement: Surface effective enrich, ranking, and CV-generation prompt identifiers, templates, and models in diagnostics.
    state: active
  - capability_id: inspection_debugging.ranking-diagnostics
    statement: Expose ranking contract details, weighted contributions, fit thresholds, and reranker reuse state.
    state: active
  - capability_id: inspection_debugging.shortlist-diagnostics
    statement: Show shortlist retrieval facts, raw-hit visibility, candidate-query inputs, and embedding reuse provenance.
    state: active
  - capability_id: inspection_debugging.cv-analysis-diagnostics
    statement: Expose analysis outcomes, selected evidence, hybrid alignment details, and analysis reuse visibility.
    state: active
  - capability_id: inspection_debugging.cv-generation-diagnostics
    statement: Expose CV-writing outcomes, grounding and support validation detail, and authoritative fit context.
    state: active
  - capability_id: inspection_debugging.reuse-diagnostics
    statement: Surface late-stage reuse snapshots and exact-match reuse counters across ranking and analysis flows.
    state: active
  - capability_id: inspection_debugging.quality-metrics-diagnostics
    statement: Show compact stage-level quality metrics across shortlist, ranking, analysis, and generation stages.
    state: active
  - capability_id: inspection_debugging.enriched-job-debug-export
    statement: Include enriched-job inspection exports with canonical skill companions, mapping suggestions, and enrich provenance.
    state: active
  - capability_id: inspection_debugging.rule-filter-diagnostics
    statement: Show active blocking filters, mark-code counts, and separate pre-enrichment reject visibility.
    state: active
