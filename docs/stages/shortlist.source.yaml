stage_id: shortlist
name: Shortlist
summary: Turn passed jobs into a retrieval-aware scoring shortlist by building a richer bounded candidate query from the full profile evidence surface, reusing the single shortlist candidate-query embedding and unchanged job-summary embeddings when safe, searching only the latest active embedding row per canonical job URL with the deterministic candidate query vector actually used for retrieval, then capturing raw hits, shortlist transitions, any backfill needed before scoring, and the stage-owned shortlist backfill-rate quality metric.
boundaries:
  - raw retrieval output enters here and the scoring shortlist leaves here
  - this stage owns the distinction between raw vector hits and the later scoring shortlist
  - shortlist transition reasons should be explainable here rather than inferred later
inputs:
  - candidate query text, bounded candidate-query components, and one reusable candidate query embedding derived from the profile evidence surface
  - passed jobs
  - vector search results
outputs:
  - '`stage_transition_artifacts.shortlist.decision_summary.quality_metrics` with shortlist backfill-rate counts and rate'
  - bounded `stage_transition_artifacts.shortlist` runtime block with input, output, and changed-state samples
  - bounded candidate-query context for the single retrieval vector used in this stage
  - bounded shortlist candidate-query components and candidate-query reuse provenance for debugging
  - fresh-versus-reused embedding provenance for passed jobs
  - raw row versus raw unique-job retrieval counts
  - raw vector hits
  - scoring shortlist
  - shortlist transition reasons including any backfill
depends_on:
  - rule_filter
primary_features:
  - inspection_debugging
related_features:
  - trigger_run_management
refs:
  docs: []
  spec:
  plan:
  history: []
keywords:
  - shortlist
  - vector search
  - retrieval
  - backfill
  - embeddings
  - reuse
status: active
