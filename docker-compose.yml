services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: uvicorn fitcv_cp.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file:
      - .env
    environment:
      - GCP_PROJECT=${GCP_PROJECT:-local}
      - BIGQUERY_DATASET=${BIGQUERY_DATASET:-fitcv}
      - FITCV_CP_DATA_BACKEND=sqlite
      - FITCV_CP_SQLITE_PATH=/app/runtime/fitcv_cp.sqlite3
      - REDIS_URL=redis://redis:6379/0
      - FITCV_LANGGRAPH_ENV_FILE=/app/.env
      - FITCV_LANGGRAPH_REPO_ROOT=/opt/fitcv-langgraph
      - FITCV_CP_SETTINGS_SQLITE_PATH=/app/runtime/fitcv_cp.sqlite3
    volumes:
      - ./.env:/app/.env:ro
      - ./config/env.yaml:/app/config/env.yaml:ro
      - ./config/runtime/control_plane.yaml:/app/config/runtime/control_plane.yaml:ro
      - ${FITCV_LANGGRAPH_REPO_PATH:-../fitcv-langgraph}:/opt/fitcv-langgraph:ro
      - ./data:/app/data
      - fitcv_runtime:/app/runtime
    depends_on: [redis]

  worker:
    build: .
    command: rq worker fitcv --url redis://redis:6379/0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GCP_PROJECT=${GCP_PROJECT:-local}
      - BIGQUERY_DATASET=${BIGQUERY_DATASET:-fitcv}
      - FITCV_CP_DATA_BACKEND=sqlite
      - FITCV_CP_SQLITE_PATH=/app/runtime/fitcv_cp.sqlite3
      - REDIS_URL=redis://redis:6379/0
      - FITCV_LANGGRAPH_ENV_FILE=/app/.env
      - FITCV_LANGGRAPH_REPO_ROOT=/opt/fitcv-langgraph
      - FITCV_CP_SETTINGS_SQLITE_PATH=/app/runtime/fitcv_cp.sqlite3
      - FITCV_ENRICH_EMIT_JOB_EVENTS=true
    volumes:
      - ./.env:/app/.env:ro
      - ./config/env.yaml:/app/config/env.yaml:ro
      - ./config/runtime/control_plane.yaml:/app/config/runtime/control_plane.yaml:ro
      - ${FITCV_LANGGRAPH_REPO_PATH:-../fitcv-langgraph}:/opt/fitcv-langgraph:ro
      - ./data:/app/data
      - fitcv_runtime:/app/runtime
    depends_on: [redis]

volumes:
  fitcv_runtime:

